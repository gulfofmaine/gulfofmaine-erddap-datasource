# A provisioned alert rule used by tests/alerting.spec.ts to prove the
# datasource is compatible with Grafana alerting. Evaluating this rule pushes
# a real query through the backend and into the expression engine, which
# rejects any response frame that is not a wide time series.
#
# The query deliberately includes the `station` String column: that is the
# shape that fails without label partitioning, since a String field alongside
# `time` makes the frame "long".
apiVersion: 1

groups:
  - orgId: 1
    name: erddap
    folder: erddap
    interval: 5m
    rules:
      - uid: erddap-air-temperature
        title: A01 air temperature
        condition: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations: {}
        labels: {}
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: erddap
            model:
              refId: A
              datasetId: A01_met
              variables: station, air_temperature

          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__

          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 40
              datasource:
                type: __expr__
                uid: __expr__
